    <text x="60" y="66" font-size="39" fill="#163331" font-weight="700" text-anchor="start">From a request to a reviewable result</text><text x="60" y="108" font-size="25" fill="#5a756c" font-weight="400" text-anchor="start">一个研发工作流示例：规划检查点、独立审查与有上限的返工</text><rect x="60" y="187" width="208" height="146" rx="20" fill="#fff" stroke="#d0ded9" stroke-width="2"/><text x="80" y="222" font-size="19" fill="#648171" font-weight="650" text-anchor="start">01</text><text x="80" y="263" font-size="30" fill="#163331" font-weight="650" text-anchor="start">Clarify</text><text x="80" y="305" font-size="23" fill="#5a756c" font-weight="400" text-anchor="start">澄清需求</text><path d="M268 262 H305" fill="none" stroke="#64877b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="310" y="187" width="208" height="146" rx="20" fill="#fff" stroke="#d0ded9" stroke-width="2"/><text x="330" y="222" font-size="19" fill="#648171" font-weight="650" text-anchor="start">02</text><text x="330" y="263" font-size="30" fill="#163331" font-weight="650" text-anchor="start">Plan</text><text x="330" y="305" font-size="23" fill="#5a756c" font-weight="400" text-anchor="start">形成方案</text><path d="M518 262 H555" fill="none" stroke="#64877b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="560" y="187" width="208" height="146" rx="20" fill="#fff" stroke="#d0ded9" stroke-width="2"/><text x="580" y="222" font-size="19" fill="#648171" font-weight="650" text-anchor="start">03</text><text x="580" y="263" font-size="30" fill="#163331" font-weight="650" text-anchor="start">Build</text><text x="580" y="305" font-size="23" fill="#5a756c" font-weight="400" text-anchor="start">实现与验证</text><path d="M768 262 H805" fill="none" stroke="#64877b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="810" y="187" width="208" height="146" rx="20" fill="#fff" stroke="#d0ded9" stroke-width="2"/>
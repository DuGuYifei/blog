ext-anchor="middle">Human checkpoint</text><text x="420" y="437" font-size="20" fill="#5a756c" font-weight="400" text-anchor="middle">确认后继续</text><path d="M414 334 V373" fill="none" stroke="#64877b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 8"/><text x="60" y="504" font-size="20" fill="#668176" font-weight="400" text-anchor="start">Illustrative workflow · The loop limit applies to branch traversals.</text></svg>
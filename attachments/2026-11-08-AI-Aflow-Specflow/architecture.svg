<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1290" viewBox="0 0 1600 1290" role="img" aria-labelledby="title desc">
    <title id="title">Aflow / Specflow — architecture</title><desc id="desc">Original project illustration based on local source code and product documentation.</desc>
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64877b"/></marker>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2329"/><stop offset="1" stop-color="#113e39"/></linearGradient></defs>
    <style>text {font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;}</style>
    <rect width="100%" height="100%" fill="#f4f7f4"/>
    <text x="60" y="74" font-size="43" fill="#163331" font-weight="700" text-anchor="start">Aflow / Specflow</text><text x="60" y="118" font-size="25" fill="#5a756c" font-weight="400" text-anchor="start">本地系统架构 · Local runtime architecture</text><text x="1180" y="74" font-size="19" fill="#5a756c" font-weight="600" text-anchor="start">SOURCE-BASED</text><rect x="60" y="165" width="315" height="112" rx="20" fill="#ffffff" stroke="#d0ded9" stroke-width="2"/><text x="84" y="210" font-size="29" fill="#163331" font-weight="650" text-anchor="start">Aflow Agent</text><text x="84" y="249" font-size="21" fill="#5a756c" font-weight="400" text-anchor="start">Pi TUI + workflow tools</text><rect x="405" y="165" width="315" height="112" rx="20" fill="#ffffff" stroke="#d0ded9" stroke-width="2"/><text x="429" y="210" font-size="29" fill="#163331" font-weight="650" text-anchor="start">Browser UI</text><text x="429" y="249" font-size="21" fill="#5a756c" font-weight="400" text-anchor="start">React · canvas + Designer</text><rect x="770" y="165" width="310" height="112" rx="20" fill="#ffffff" stroke="#d0ded9" stroke-width="2"/><text x="794" y="210" font-size="29" fill="#163331" font-weight="650" text-anchor="start">Direct CLI</text><text x="794" y="249" font-size="21" fill="#5a756c" font-weight="400" text-anchor="start">specflow run</text><path d="M218 277 V325" fill="none" stroke="#64877b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M563 277 V325" fill="none" stroke="#64877b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M925 277 V695 H601 C600 677 570 677 569 695 H435 V556 H422" fill="none" stroke="#64877b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="944" y="454" font-size="21" fill="#5a756c" font-weight="400" text-anchor="start">No HTTP</text><text x="944" y="483" font-size="21" fill="#5a756c" font-weight="400" text-anchor="start">server</text><rect x="60" y="326" width="660" height="123" rx="20" fill="#e2efdf" stroke="#a5bfa4" stroke-width="2"/><text x="84" y="373" font-size="31" fill="#163331" font-weight="650" text-anchor="start">Specflow local server</text><text x="84" y="414" font-size="23" fill="#456254" font-weight="400" text-anchor="start">Bun.serve · HTTP API · SSE · embedded UI</text><path d="M234 449 V500" fill="none" stroke="#64877b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M585 449 V500" fill="none" stroke="#64877b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60" y="500" width="360" height="170" rx="20" fill="#ffffff" stroke="#d0ded9" stroke-width="2"/><text x="85" y="544" font-size="27" fill="#163331" font-weight="650" text-anchor="start">Workflow execution</text><text x="85" y="585" font-size="22" fill="#5a756c" font-weight="400" text-anchor="start">bridge / WorkflowExecutor</text><text x="85" y="623" font-size="21" fill="#5a756c" font-weight="400" text-anchor="start">workflow models + validation</text><text x="85" y="651" font-size="21" fill="#5a756c" font-weight="400" text-anchor="start">sessions · gates · checkpoints</text><rect x="450" y="500" width="270" height="170" rx="20" fill="#ffffff" stroke="#d0ded9" stroke-width="2"/><text x="474" y="544" font-size="26" fill="#163331" font-weight="650" text-anchor="start">Designer service</text><text x="474" y="585" font-size="22" fill="#5a756c" font-weight="400" text-anchor="start">Projects + sessions</text><text x="474" y="623" font-size="21" fill="#5a756c" font-weight="400" text-anchor="start">HTML / Vite preview</text><text x="474" y="651" font-size="21" fill="#5a756c" font-weight="400" text-anchor="start">References + Git</text><path d="M234 670 V730" fill="none" stroke="#64877b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M585 670 V730" fill="none" stroke="#64877b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60" y="730" width="1020" height="142" rx="20" fill="#e0eeeb" stroke="#a4c3ba" stroke-width="2"/><text x="86" y="776" font-size="31" fill="#163331" font-weight="650" text-anchor="start">Agent integration  /  agent-proxy</text><text x="86" y="821" font-size="25" fill="#45685e" font-weight="400" text-anchor="start">Registry &amp; custom ACP  ·  headless commands  ·  session pool</text><text x="86" y="851" font-size="21" fill="#5a756c" font-weight="400" text-anchor="start">Agent capabilities, authentication and process connections</text><path d="M570 872 V934" fill="none" stroke="#64877b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60" y="935" width="1020" height="142" rx="20" fill="#ffffff" stroke="#d0ded9" stroke-width="2"/><text x="86" y="983" font-size="31" fill="#163331" font-weight="650" text-anchor="start">Agent processes</text><text x="86" y="1025" font-size="24" fill="#5a756c" font-weight="400" text-anchor="start">Codex / Claude / Gemini adapters · custom agents · batch commands</text><text x="86" y="1056" font-size="21" fill="#5a756c" font-weight="400" text-anchor="start">Model services depend on the selected agent and its configuration.</text><rect x="1160" y="326" width="380" height="751" rx="20" fill="#eef1e8" stroke="#cbd4bd" stroke-width="2"/><text x="1188" y="373" font-size="29" fill="#163331" font-weight="650" text-anchor="start">Local workspace</text><text x="1188" y="414" font-size="23" fill="#5a756c" font-weight="400" text-anchor="start">.aflow/.specflow/</text><path d="M720 386 H908 Q925 360 942 386 H1158" fill="none" stroke="#64877b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 8" marker-end="url(#arrow)"/><text x="777" y="361" font-size="20" fill="#5a756c" font-weight="400" text-anchor="start">read / persist</text><text x="1188" y="495" font-size="24" fill="#163331" font-weight="600" text-anchor="start">Workflow definitions</text><text x="1188" y="533" font-size="23" fill="#5a756c" font-weight="400" text-anchor="start">YAML + canvas JSON</text><text x="1188" y="605" font-size="24" fill="#163331" font-weight="600" text-anchor="start">Run state</text><text x="1188" y="643" font-size="23" fill="#5a756c" font-weight="400" text-anchor="start">Snapshots + checkpoints</text><text x="1188" y="715" font-size="24" fill="#163331" font-weight="600" text-anchor="start">Event history</text><text x="1188" y="753" font-size="23" fill="#5a756c" font-weight="400" text-anchor="start">JSONL logs + timelines</text><text x="1188" y="825" font-size="24" fill="#163331" font-weight="600" text-anchor="start">Design artifacts</text><text x="1188" y="863" font-size="23" fill="#5a756c" font-weight="400" text-anchor="start">HTML / React + manifest</text><text x="1188" y="935" font-size="24" fill="#163331" font-weight="600" text-anchor="start">Configuration</text><text x="1188" y="973" font-size="23" fill="#5a756c" font-weight="400" text-anchor="start">Agent settings + overrides</text><rect x="60" y="1130" width="1480" height="116" rx="20" fill="#173d37" stroke="#173d37" stroke-width="2"/><text x="88" y="1175" font-size="28" fill="#edf4e7" font-weight="600" text-anchor="start">Execution and recovery have explicit boundaries.</text><text x="88" y="1217" font-size="23" fill="#bed5c8" font-weight="400" text-anchor="start">Server path: interactive runs + event history.  Direct CLI: terminal execution without the browser run list.</text></svg>